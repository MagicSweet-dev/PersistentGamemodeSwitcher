name: Tag and release

on:
  push:
    branches: [ main, feature/* ]


permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mikefarah/yq@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            yq --input-format=properties \
              -r '.mod_version' gradle.properties
          )"

          test -n "$version"
          test "$version" != "null"

          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Replace tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push origin --delete "$TAG" || true
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin --force "refs/tags/$TAG"

  build:
    needs: tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.tag }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ github.ref_name != 'main' }}
          makeLatest: ${{ github.ref_name == 'main' }}
          artifacts: "build/versions/*/build/libs/*.jar"