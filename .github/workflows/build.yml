name: Tag and release

on:
  push:
    branches: [main, feature/*, fix/*]


permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mikefarah/yq@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          
          version="$(
            yq --input-format=properties \
              -r '.mod_version' gradle.properties
          )"
          
          test -n "$version"
          test "$version" != "null"
          
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          
          if [[ "$branch" != "main" ]]; then
            # Strip the prefix (feature/, fix/, etc.) if there is one
            name="${branch#*/}"
            sanitized="$(
              printf '%s' "$name" \
                | tr '[:upper:]' '[:lower:]' \
                | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g'
            )"
            test -n "$sanitized"
            version="${version}-pre-${sanitized}"
            prerelease=true
          else
            prerelease=false
          fi
          
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Replace tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push origin --delete "$TAG" || true
          git tag --force "$TAG" "$GITHUB_SHA"
          git push origin --force "refs/tags/$TAG"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run client GameTests
        run: ./gradlew runClientGameTest

  build:
    needs: tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.tag }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ needs.tag.outputs.prerelease }}
          makeLatest: ${{ needs.tag.outputs.prerelease != 'true' }}
          artifacts: "versions/**/build/libs/*.jar"
