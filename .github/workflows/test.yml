name: Run tests
on:
  push:
    branches: [main, feature/*, fix/*]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run client GameTests
        run: ./gradlew runClientGameTest

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.tag }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: ${{ needs.tag.outputs.prerelease }}
          makeLatest: ${{ needs.tag.outputs.prerelease != 'true' }}
          artifacts: "versions/**/build/libs/*.jar"
